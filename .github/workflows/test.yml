name: Test

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Test
        run: pytest tests/ -q
      - name: Compile
        run: python -m compileall core adapters server main.py tests
      - name: CLI smoke
        run: |
          python main.py --help
          python -c "import subprocess, sys; r = subprocess.run([sys.executable, 'main.py', '--check', '--json']); sys.exit(0 if r.returncode in (0, 1) else r.returncode)"
