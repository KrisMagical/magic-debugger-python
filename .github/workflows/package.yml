name: Package

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel
        run: |
          python -m pip install dist/*.whl
      - name: CLI smoke
        run: |
          magic-debug --help
          python scripts/ci_check_installed_diagnostics.py
