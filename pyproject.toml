[project]
name = "magic-debug"
version = "1.0.0"
description = "GDB Debug Adapter Protocol backend for Vim and Neovim"
authors = [{ name = "Magic Debug Team" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.8"
keywords = ["gdb", "dap", "debugger", "vim", "neovim", "debugging", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/magic-debug/magic-debug"
Repository = "https://github.com/magic-debug/magic-debug"
Issues = "https://github.com/magic-debug/magic-debug/issues"

[project.scripts]
magic-debug = "main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "adapters", "server"]
py-modules = ["main"]

[tool.setuptools.data-files]
"share/magic-debug" = ["config.example.json", "README.md", "LICENSE"]
"share/magic-debug/vim-plugin/lua/magic-debug" = ["vim-plugin/lua/magic-debug/init.lua"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
